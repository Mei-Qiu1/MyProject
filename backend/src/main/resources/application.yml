
server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-drug-management
  datasource:
    url: jdbc:mysql://localhost:3307/hospital_drug?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.hospital.entity

# JWT配置
jwt:
  secret: hospital_drug_management_system_jwt_secret_key_2024
  expiration: 86400000

# 日志配置
logging:
  level:
    com.example.hospital: DEBUG
    org.springframework.security: INFO
